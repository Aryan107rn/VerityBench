<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />
    <meta
      name="description"
      content="VerityBench — test agents and trust the evidence."
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('veritybench.theme')
          document.documentElement.dataset.theme = stored === '"light"' ? 'light' : 'dark'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>VerityBench · Agent reliability workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
