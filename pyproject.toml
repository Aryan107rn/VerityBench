[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritybench"
version = "0.1.0"
description = "Evidence-first testing and evaluation for AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "click==8.1.8",
  "fastapi==0.144.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.37",
  "typer==0.15.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
  "bandit==1.8.0",
]

[project.scripts]
veritybench = "veritybench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101", "S105", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["veritybench", "veritybench_engine"]
